name: Publicar atualizacao do Consecom Plugin
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validar codigo
        run: go test ./...
      - name: Compilar Consecom Plugin e instalador
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $expected = 'const consecomVersion = "' + $version + '"'
          if (-not (Get-Content update.go -Raw).Contains($expected)) { throw "Versão interna diferente da tag; atualize update.go antes de publicar" }
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H windowsgui' -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { throw 'falha build MCP' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags='-s -w -H windowsgui' -o "dist/Consecom_Plugin_v$version.exe" ./installer
          if ($LASTEXITCODE -ne 0) { throw 'falha build instalador' }
          $hash = (Get-FileHash "dist/Consecom_Plugin_v$version.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/download/v${version}/Consecom_Plugin_v${version}.exe"
          @{ version=$version; url=$releaseUrl; sha256=$hash } | ConvertTo-Json -Compress | Set-Content -Encoding UTF8 -Path dist/consecom-update.json
      - name: Publicar GitHub Release e manifesto
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Consecom_Plugin_v*.exe
            dist/consecom-update.json
