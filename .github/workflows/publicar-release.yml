name: Compilar e publicar Consecom Plugin
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Consecom_Plugin_v2_6_Source.zip'
      - '**/*.go'
      - 'go.mod'
      - '.github/workflows/publicar-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Extrair fonte inicial, quando necessario
        shell: pwsh
        run: |
          if (-not (Test-Path main.go)) {
            if (-not (Test-Path Consecom_Plugin_v2_6_Source.zip)) {
              throw 'Codigo fonte ausente. Publique o pacote Consecom_Plugin_v2_6_Source.zip no repositorio.'
            }
            Expand-Archive -Path Consecom_Plugin_v2_6_Source.zip -DestinationPath . -Force
          }
      - name: Conferir versao
        id: version
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content update.go -Raw), 'const consecomVersion = "([^"]+)"')
          if (-not $m.Success) { throw 'Versao nao encontrada em update.go' }
          $version = $m.Groups[1].Value
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}" -ne "v$version") {
            throw 'Tag e versao interna nao correspondem.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Preparar executavel para testes no Windows
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H windowsgui' -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar payload' }
      - name: Testar codigo
        run: go test ./...
      - name: Registrar codigo fonte no repositorio
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ((git status --porcelain).Length -gt 0) {
            git commit -m "build: extrair fonte verificada da v2.6"
            git push origin HEAD:main
          }
      - name: Compilar executaveis Windows
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H windowsgui' -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Falha no build do Consecom' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags='-s -w -H windowsgui' -o "dist/Consecom_Plugin_v$version.exe" ./installer
          if ($LASTEXITCODE -ne 0) { throw 'Falha no build do instalador' }
          $hash = (Get-FileHash "dist/Consecom_Plugin_v$version.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/download/v${version}/Consecom_Plugin_v${version}.exe"
          @{ version=$version; url=$releaseUrl; sha256=$hash } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 -Path dist/consecom-update.json
      - name: Publicar release com instalador e manifesto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: |
            dist/Consecom_Plugin_v*.exe
            dist/consecom-update.json
