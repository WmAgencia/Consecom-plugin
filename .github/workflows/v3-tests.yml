name: Testes de desenvolvimento v3
on:
  push:
    branches:
      - feature/consecom-v3-release
      - fix/v3-maximum-approval
      - feature/v4-editor-ui-creative-workflows
      - feature/v4.1.1-maximum-mode-audit
      - feature/v4.2-windows-any-app-launcher
      - feature/v4.3-dev-stack-hub
      - feature/v4.4-local-preview-runtime
      - feature/v4.5-visual-code-cloud
      - feature/v4.6-agent-browser-bridge
      - feature/v4.7-contexto-obsidian-hybrid-browser
      - release/v4.8.0-context-integrations
      - feat/v4.9-context-autodiscovery-obsidian-ui
      - feat/v4.10-obsidian-infinite-graph
      - feat/v4.11-exclusive-browser-graph-index
      - feat/v4.12-live-lab-single-mcp
      - feat/v4.13-consecom-chat-outbox
      - fix/v4.13.1-live-widget-backcompat
      - feat/v4.14-bidirectional-consecom-chat
      - perf/v4.14.1-chat-latency
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-v3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preparar executavel local
        shell: pwsh
        run: |
          go build -trimpath -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Testes Windows
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "consecom-v3"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $env:TEMP = $tmp
          $env:TMP = $tmp
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Gerar instalador PREVIEW sem release
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H windowsgui' -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Path dist-preview -Force | Out-Null
          go build -trimpath -ldflags='-s -w -H windowsgui' -o dist-preview/Consecom_Plugin_v4.14.1_PREVIEW.exe ./installer
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash dist-preview/Consecom_Plugin_v4.14.1_PREVIEW.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding ascii dist-preview/SHA256.txt
      - name: Disponibilizar artefato temporario para teste no PC
        uses: actions/upload-artifact@v4
        with:
          name: consecom-4.14.1-preview-windows
          path: |
            dist-preview/Consecom_Plugin_v4.14.1_PREVIEW.exe
            dist-preview/SHA256.txt
          if-no-files-found: error
          retention-days: 7
