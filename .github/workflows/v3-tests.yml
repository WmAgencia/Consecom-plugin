name: Testes de desenvolvimento v3
on:
  push:
    branches:
      - feature/consecom-v3-release
      - fix/v3-maximum-approval
      - feature/v4-editor-ui-creative-workflows
      - feature/v4.1.1-maximum-mode-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-v3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preparar executavel local
        shell: pwsh
        run: |
          go build -trimpath -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Testes Windows
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "consecom-v3"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $env:TEMP = $tmp
          $env:TMP = $tmp
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Gerar instalador PREVIEW sem release
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H windowsgui' -o installer/payload/MCP-PC.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Path dist-preview -Force | Out-Null
          go build -trimpath -ldflags='-s -w -H windowsgui' -o dist-preview/Consecom_Plugin_v4.1.1_PREVIEW.exe ./installer
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash dist-preview/Consecom_Plugin_v4.1.1_PREVIEW.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding ascii dist-preview/SHA256.txt
      - name: Disponibilizar artefato temporario para teste no PC
        uses: actions/upload-artifact@v4
        with:
          name: consecom-4.1.1-preview-windows
          path: |
            dist-preview/Consecom_Plugin_v4.1.1_PREVIEW.exe
            dist-preview/SHA256.txt
          if-no-files-found: error
          retention-days: 7
