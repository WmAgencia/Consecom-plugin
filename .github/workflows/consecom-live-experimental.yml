name: Consecom Live experimental
on:
  push:
    branches:
      - feat/consecom-live-poc-mcp-sse
      - feat/consecom-live-reverse-wait-lab
  pull_request:
    paths:
      - experiments/consecom-live-poc/**
      - .github/workflows/consecom-live-experimental.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test live and reverse-event POC
        run: go test -race -v ./experiments/consecom-live-poc
        if: matrix.os == 'ubuntu-latest'
      - name: Windows Go tests
        if: matrix.os == 'windows-latest'
        run: go test -v ./experiments/consecom-live-poc
      - name: Build Windows preview executable
        if: matrix.os == 'windows-latest'
        run: go build -trimpath -o Consecom-Live-POC.exe ./experiments/consecom-live-poc
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: consecom-live-poc-windows-experimental
          path: Consecom-Live-POC.exe
          retention-days: 7
