name: Validar relay Railway
on:
  push:
    branches: [feat/railway-relay-versioned-v416, main]
    paths:
      - 'railway/relay/**'
      - '.github/workflows/relay-bun-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validar sintaxe e compatibilidade Bun
        run: bun build railway/relay/index.tsx --target=bun --outdir=/tmp/consecom-build
      - name: Validar Dockerfile
        run: test -s railway/relay/Dockerfile
